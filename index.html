<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Gestión de Playas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Gestión de Playas</h1>
      <span id="version">Versión —</span>
    </div>
    <div class="top-actions">
      <button id="btnUnificar" class="primary">Unificar Excel</button>
      <button id="btnBarcode" disabled>Generar códigos</button>
      <button id="btnDownload" disabled>Descargar Excel</button>
    </div>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" multiple hidden>
      <div class="drop-icon">＋</div>
      <h2>Cargar planillas</h2>
      <p>Arrastrá uno o varios archivos Excel aquí o seleccioná archivos.</p>
      <button id="btnSelect">Seleccionar archivos</button>
      <div id="fileList" class="file-list"></div>
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="toolbar">
        <div class="stats">
          <span>Total: <b id="totalCount">0</b></span>
          <span>Visibles: <b id="visibleCount">0</b></span>
          <span>Ocultos: <b id="hiddenCount">0</b></span>
          <span>Conflictos: <b id="conflictCount">0</b></span>
        </div>
        <div class="filters">
          <input id="searchInput" placeholder="Buscar chasis...">
          <select id="filterPlaya"><option value="">Playa: todas</option></select>
          <select id="filterBloque"><option value="">Bloque: todos</option></select>
          <select id="filterEstado"><option value="">Estado: todos</option><option value="OK">OK</option><option value="REVISAR">REVISAR</option></select>
          <button id="btnShowHidden">Mostrar ocultos</button>
        </div>
      </div>

      <div id="message" class="message hidden"></div>

      <div class="table-wrap">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Numero de Chasis</th><th>Playa</th><th>Bloque</th><th>Carril</th>
              <th>Posicion</th><th>Ubicacion</th><th>Observacion</th><th>Estado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="cardOverlay" class="overlay hidden">
    <article id="vehicleCard" class="card" tabindex="-1">
      <button id="cardClose" class="card-close" aria-label="Cerrar">×</button>
      <div class="card-kicker">VEHÍCULO</div>
      <h2 id="cardChassis">—</h2>
      <div id="cardBarcode" class="barcode"></div>
      <div class="location" id="cardLocation">—</div>
      <div id="cardObservation" class="observation"></div>
      <div class="card-actions">
        <button id="cardHide" class="primary">Ocultar</button>
        <button id="cardDelete" class="danger">Borrar</button>
      </div>
      <div class="card-nav">
        <button id="cardPrev">← Anterior</button>
        <button id="cardNext">Siguiente →</button>
      </div>
    </article>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="js/version.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

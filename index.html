<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5f9a3d">
  <title>Gestión de Playas</title>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Gestión de Playas</h1>
      <span id="version">Versión —</span>
    </div>
    <div class="top-actions">
      <button id="btnUnificar" class="primary">Unificar Excel</button>
      <button id="btnBarcode" disabled>Generar códigos</button>
      <button id="btnDownload" disabled>Descargar Excel</button>
    </div>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" multiple hidden>
      <div class="drop-icon">＋</div>
      <h2>Cargar planillas</h2>
      <p>Arrastrá uno o varios archivos Excel aquí o seleccioná archivos.</p>
      <button id="btnSelect">Seleccionar archivos</button>
      <div id="fileList" class="file-list"></div>
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="toolbar">
        <div class="stats">
          <span>Total: <b id="totalCount">0</b></span>
          <span>Visibles: <b id="visibleCount">0</b></span>
          <span>Ocultos: <b id="hiddenCount">0</b></span>
          <span>Conflictos: <b id="conflictCount">0</b></span>
        </div>
        <div class="filters">
          <input id="searchInput" placeholder="Buscar chasis...">
          <select id="filterPlaya"><option value="">Playa: todas</option></select>
          <select id="filterBloque"><option value="">Bloque: todos</option></select>
          <select id="filterEstado"><option value="">Estado: todos</option><option value="OK">OK</option><option value="REVISAR">REVISAR</option></select>
          <button id="btnShowHidden">Mostrar ocultos</button><button id="btnClearAll" class="danger-outline">Borrar Todo</button>
        </div>
      </div>

      <div id="message" class="message hidden"></div>

      <div class="table-wrap">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Numero de Chasis</th><th>Playa</th><th>Bloque</th><th>Carril</th>
              <th>Posicion</th><th>Ubicacion</th><th>Observacion</th><th>Estado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="cardOverlay" class="overlay hidden">
    <article id="vehicleCard" class="card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="cardChassis">
      <button id="cardClose" class="card-close" aria-label="Cerrar">×</button>
      <div class="card-kicker">VEHÍCULO</div>
      <h2 id="cardChassis">—</h2>
      <div id="cardBarcode" class="barcode"></div>
      <div class="location" id="cardLocation">—</div>
      <div id="cardConflicts" class="card-conflicts hidden"></div>
      <div id="cardObservation" class="observation"></div>
      <div class="card-actions">
        <button id="cardHide" class="primary">Ocultar</button>
        <button id="cardDelete" class="danger">Borrar</button>
      </div>
      <div class="card-nav">
        <button id="cardPrev">← Anterior</button>
        <button id="cardNext">Siguiente →</button>
      </div>
    </article>
  </div>

  <div id="clearAllOverlay" class="overlay hidden">
    <article class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="clearAllTitle">
      <div class="confirm-icon">!</div>
      <h2 id="clearAllTitle">¿Borrar todos los avances?</h2>
      <p id="clearAllText"></p>
      <div class="confirm-actions">
        <button id="clearCancel">Cancelar</button>
        <button id="clearConfirm" class="danger">Borrar Todo</button>
      </div>
    </article>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    (async function(){
      try{
        const versionUrl="js/version.js?check="+Date.now();
        const response=await fetch(versionUrl,{cache:"no-store"});
        if(!response.ok) throw new Error("No se pudo comprobar la versión.");
        const source=await response.text();
        const match=source.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
        if(!match) throw new Error("Versión inválida.");
        window.APP_VERSION=match[1];

        const load=(tag,attrs)=>{
          const el=document.createElement(tag);
          Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
          document.head.appendChild(el);
        };

        load("link",{rel:"stylesheet",href:"css/estilos.css?v="+encodeURIComponent(window.APP_VERSION)});
        const xlsx=document.createElement("script");
        xlsx.src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
        const exceljs=document.createElement("script");
        exceljs.src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
        const barcode=document.createElement("script");
        barcode.src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js";

        await new Promise((resolve,reject)=>{
          xlsx.onload=resolve;
          xlsx.onerror=()=>reject(new Error("No se pudo cargar Excel."));
          document.body.appendChild(xlsx);
        });

        await new Promise((resolve,reject)=>{
          exceljs.onload=resolve;
          exceljs.onerror=()=>reject(new Error("No se pudo cargar el exportador de Excel."));
          document.body.appendChild(exceljs);
        });

        await new Promise((resolve,reject)=>{
          barcode.onload=resolve;
          barcode.onerror=()=>reject(new Error("No se pudo cargar el generador de códigos de barras."));
          document.body.appendChild(barcode);
        });

        const app=document.createElement("script");
        app.type="module";
        app.src="js/app.js?v="+encodeURIComponent(window.APP_VERSION);
        document.body.appendChild(app);
      }catch(err){
        console.error(err);
        document.getElementById("version").textContent="Error de actualización";
        alert(err.message||"No se pudo cargar Gestión de Playas.");
      }
    })();
  </script>
</body>
</html>
